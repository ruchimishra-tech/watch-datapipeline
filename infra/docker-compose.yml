version: "3.8"

# Watch Data Pipeline Observability Stack — Local Dev
# Start everything: docker-compose up
# Stop everything:  docker-compose down -v

networks:
  observability:
    driver: bridge

volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

services:

  # ── ADOT Collector ─────────────────────────────────────────────────────────
  # Receives spans from the SDK via OTLP, applies PII redaction, routes to Tempo
  collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: watch_collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Collector pipeline metrics (Prometheus scrape)
    networks:
      - observability

  # ── Grafana Tempo ──────────────────────────────────────────────────────────
  # Trace storage backend — receives spans from the collector
  tempo:
    image: grafana/tempo:2.4.1
    container_name: watch_tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../infra/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (used by Grafana datasource and obs-cli verify)
      - "9095:9095"   # Tempo gRPC
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Metrics storage — scrapes collector internal metrics + pipeline metrics
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: watch_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Visualisation — pre-configured with Tempo and Prometheus datasources
  grafana:
    image: grafana/grafana:10.3.3
    container_name: watch_grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ../infra/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - ../infra/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Alertmanager ───────────────────────────────────────────────────────────
  # Routes firing Prometheus alerts to Slack / email
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: watch_alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    volumes:
      - ../infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../infra/alertmanager-templates.tmpl:/etc/alertmanager/templates/watch.tmpl:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Banking Marketplace Simulator ─────────────────────────────────────────
  # Exposes realistic data_product_* Prometheus metrics for 13 banking products
  # across 6 portfolios with time-driven scenarios (market hours, EOD, AML, etc.)
  banking-simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    container_name: watch_banking_simulator
    command: ["python", "-m", "simulator.banking_marketplace_simulator"]
    environment:
      - BANKING_METRICS_PORT=8097
      - WATCH_DEPLOYMENT_ENVIRONMENT=docker-dev
    ports:
      - "8097:8097"
    networks:
      - observability
    restart: unless-stopped

  # ── Pipeline Simulator ─────────────────────────────────────────────────────
  # Emits real OTel spans (pipeline.run, etl.extract/transform/load) to Tempo
  # and exposes simulator_pipeline_* Prometheus metrics (scraped at port 8099)
  pipeline-simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    container_name: watch_pipeline_simulator
    # Default CMD runs the pipeline simulator
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - WATCH_DEPLOYMENT_ENVIRONMENT=docker-dev
      - SIMULATOR_METRICS_PORT=8099
    ports:
      - "8099:8099"
    networks:
      - observability
    depends_on:
      - collector
    restart: unless-stopped

  # ── Trace Seeder ────────────────────────────────────────────────────────────
  # One-shot: seeds 40 demo traces into Tempo on first stack start.
  # Runs fast-mode scenarios (50ms phases) so the L2 dashboard has data
  # immediately without waiting for the pipeline simulator's full intervals.
  trace-seeder:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    container_name: watch_trace_seeder
    command: ["python", "-m", "simulator.trace_seeder"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - WATCH_DEPLOYMENT_ENVIRONMENT=docker-dev
    networks:
      - observability
    depends_on:
      - collector
    restart: "no"

  # ── Loki ───────────────────────────────────────────────────────────────────
  # Log aggregation — receives logs from pipelines and synthesizer
  loki:
    image: grafana/loki:2.9.5
    container_name: watch_loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../infra/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
