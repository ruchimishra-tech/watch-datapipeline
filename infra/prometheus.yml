global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "collector"
    static_configs:
      - targets: ["collector:9464"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
