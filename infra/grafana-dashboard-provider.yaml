apiVersion: 1

providers:
  - name: "watch-dashboards"
    orgId: 1
    folder: "Watch Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false   # All changes must go through code, never the UI
    options:
      path: /etc/grafana/provisioning/dashboards/json
